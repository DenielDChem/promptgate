[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgate"
version = "0.4.2"
description = "PGate — Prompt ORM for LLM agents. Store, compile, validate and cache prompt contracts locally."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "click>=8.1",
    "mcp>=1.0",
    "loguru>=0.7",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
crypto = [
    "cryptography>=41.0",
]
watch = [
    "watchdog>=3.0",
]
litellm = [
    "litellm>=1.0",
]
serve = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "aiofiles>=23.0",
]
postgres = [
    "psycopg2-binary>=2.9",
]

[project.scripts]
pgate = "promptgate.cli:main"
promptgate = "promptgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["promptgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=promptgate --cov-report=term-missing"
